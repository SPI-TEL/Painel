<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAINEL DE CONTROLE - SPI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: radial-gradient(circle at top, #f4f8fc 0%, #e5eef7 100%);
      background-attachment: fixed;
      min-height: 100vh;
      color: #0b1a2d;
      overflow-x: hidden;
      position: relative;
    }

    /* Detalhe sutil de grid futurista de fundo */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(11, 79, 156, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(11, 79, 156, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -1;
      pointer-events: none;
    }

    /* HEADER */
    .header {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(180, 208, 240, 0.5);
      color: #0b4f9c;
      padding: 16px 40px;
      position: relative;
      box-shadow: 0 4px 30px rgba(11, 79, 156, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 70px;
      z-index: 10;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
    }

    #nome-usuario {
      font-size: 15px;
      font-weight: 700;
      color: #0c2d54;
    }

    .user-info span.role-badge {
      background: linear-gradient(135deg, #0b4f9c 0%, #0084d6 100%);
      color: #ffffff;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 132, 214, 0.25);
    }

    .last-access {
      font-size: 11px;
      color: #627b99;
      letter-spacing: 0.2px;
      font-weight: 500;
    }

    .header-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #083366;
      text-transform: uppercase;
      text-align: center;
      flex-grow: 1;
    }

    .btn-logout {
      background: #fdf2f2;
      border: 1px solid #f9d5d5;
      color: #dc2626;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-logout:hover {
      background: #dc2626;
      color: #ffffff;
      border-color: #dc2626;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
    }

    /* GRID DO PAINEL */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 30px;
      padding: 40px;
      max-width: 1240px;
      margin: 0 auto;
    }

    /* CARDS EM MODO CLARO FUTURISTA */
    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      color: #083366;
      text-decoration: none;
      box-shadow: 
        0 8px 32px rgba(31, 82, 145, 0.05),
        inset 0 0 0 1px rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(180, 208, 240, 0.35);
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 145px;
      overflow: hidden;
    }

    /* Brilho neon de fundo nos cards */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 120%, rgba(0, 162, 255, 0.06), transparent 70%);
      transition: all 0.4s ease;
      z-index: 0;
    }

    /* Efeito de neon interno ao passar o mouse */
    .card:hover {
      transform: translateY(-6px) scale(1.02);
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 
        0 14px 40px rgba(11, 79, 156, 0.09),
        0 0 15px rgba(0, 132, 214, 0.15),
        inset 0 0 0 1px rgba(255, 255, 255, 0.9);
      border-color: rgba(0, 132, 214, 0.4);
    }

    /* Ícones das aplicações */
    .card img, .card svg {
      width: 54px;
      height: 54px;
      margin-bottom: 16px;
      z-index: 1;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.4s ease;
      filter: drop-shadow(0 4px 8px rgba(0, 84, 166, 0.1));
    }

    /* Ao passar o mouse nos ícones, adiciona brilho suave de neon */
    .card:hover img, .card:hover svg {
      transform: scale(1.15) translateY(-2px);
      filter: drop-shadow(0 6px 14px rgba(0, 132, 214, 0.35));
    }

    /* Modificador para SVG de antena ou planilhas (HL5/NCCOR) */
    .card svg {
      stroke: #0084d6;
      transition: stroke 0.4s ease;
    }
    
    .card:hover svg {
      stroke: #00bfff;
    }

    /* Texto do card */
    .card span {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      z-index: 1;
      color: #0b325e;
      transition: color 0.3s ease;
      line-height: 1.4;
    }

    .card:hover span {
      color: #0076cc;
    }

    /* Responsividade para o Header */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        text-align: center;
      }
      .user-info {
        align-items: center;
      }
      .btn-logout {
        position: static;
        margin-top: 5px;
      }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="user-info">
    <span id="nome-usuario">Olá, Usuário</span>
    <span id="perfil-usuario" class="role-badge">Perfil</span>
    <span id="info-ultimo-acesso" class="last-access">Último acesso: --</span>
  </div>

  <div class="header-title">PAINEL DE CONTROLE - SPI</div>

  <button class="btn-logout" onclick="logout()">
    <i class="fa-solid fa-right-from-bracket"></i>
    <span>Sair</span>
  </button>
</div>

<div class="grid-container">

  <!-- 1. Desempenho Regionais (Oculto para Coordenador e Supervisor) -->
  <a id="card-desempenho-regionais" href="https://spi-tel.github.io/Desempenho-SPI---Regionais/" class="card" target="_blank">
    <img src="https://cdn-icons-png.flaticon.com/512/2920/2920329.png" alt="Desempenho Regionais">
    <span>Desempenho Regionais</span>
  </a>

  <!-- 2. Horas Extras (Oculto para Supervisor) -->
  <a id="card-horas-extras" href="https://spi-tel.github.io/Fechamento-Horas-Extras/" class="card" target="_blank" style="border-color: rgba(0, 162, 255, 0.25); box-shadow: 0 8px 32px rgba(0, 132, 214, 0.04);">
    <img src="https://cdn-icons-png.flaticon.com/512/1584/1584808.png" alt="Horas Extras">
    <span>Horas Extras</span>
  </a>

  <!-- 3. Controle GMG -->
  <a id="card-controle-gmg" href="https://spi-tel.github.io/Controle-GMGM/" class="card" target="_blank">
    <img src="https://cdn-icons-png.flaticon.com/512/3103/3103318.png" alt="Controle GMG">
    <span>Controle GMG</span>
  </a>

  <!-- 4. NC/COR -->
  <a id="card-nc-cor" href="https://spi-tel.github.io/NC-COR/" class="card" target="_blank">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
      <rect x="8" y="2" width="8" height="4" rx="1" ry="1" fill="rgba(0, 132, 214, 0.05)"></rect>
      <path d="m9 14 2 2 4-4"></path>
    </svg>
    <span>NC/COR</span>
  </a>

  <!-- 5. Furto e Vandalismo -->
  <a id="card-furto-vandalismo" href="https://spi-tel.github.io/Furto-e-Vandalismo/" class="card" target="_blank">
    <img src="https://cdn-icons-png.flaticon.com/512/564/564619.png" alt="Furto e Vandalismo" style="filter: drop-shadow(0 4px 8px rgba(220, 140, 0, 0.15));">
    <span>Furto e Vandalismo</span>
  </a>

  <!-- 6. TA - Causa Perda -->
  <a id="card-causas-perda-tas" href="https://spi-tel.github.io/Causas-Perca-TAs/" class="card" target="_blank">
    <img src="https://cdn-icons-png.flaticon.com/512/2921/2921222.png" alt="TA - Causa Perda">
    <span>TA - Causa Perda</span>
  </a>

  <!-- 7. HL5 -->
  <a id="card-hl5" href="https://spi-tel.github.io/HL5/" class="card" target="_blank">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L5 22h14L12 2z"></path>
      <path d="M7 17h10"></path>
      <path d="M8.5 12h7"></path>
      <path d="M10 7h4"></path>
      <path d="M17 4a4 4 0 0 1 0 5"></path>
      <path d="M7 4a4 4 0 0 0 0 5"></path>
      <path d="M19 2a8 8 0 0 1 0 9"></path>
      <path d="M5 2a8 8 0 0 0 0 9"></path>
    </svg>
    <span>HL5</span>
  </a>

  <!-- 8. USCA - Modernização -->
  <a id="card-usca" href="https://spi-tel.github.io/Moderniza-o-USCA/" class="card" target="_blank">
    <img src="https://cdn-icons-png.flaticon.com/512/2092/2092063.png" alt="USCA - Modernização">
    <span>USCA - Modernização</span>
  </a>

  <!-- 9. Sobressalentes (Exclusivo para Supervisores e Administradores) -->
  <a id="card-sobressalentes" href="https://spi-tel.github.io/Sobressalentes/" class="card" target="_blank">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
      <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
      <line x1="12" y1="22.08" x2="12" y2="12"></line>
    </svg>
    <span>Sobressalentes</span>
  </a>

  <!-- 10. Produção FAT-B (Exclusivo para Coordenadores, Gerentes e Administradores) -->
  <a id="card-producao-fatb" href="https://spi-tel.github.io/Producao-FAT-B/" class="card" target="_blank">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="20" x2="18" y2="10"></line>
      <line x1="12" y1="20" x2="12" y2="4"></line>
      <line x1="6" y1="20" x2="6" y2="14"></line>
    </svg>
    <span>Produção FAT-B</span>
  </a>

</div>

<script>
  // 1. Verificação de sessão
  const usuarioLogado = localStorage.getItem("usuario_logado");
  const perfilUsuario = (localStorage.getItem("perfil_usuario") || "").trim();
  const ultimoAcesso = localStorage.getItem("ultimo_acesso");

  if (!usuarioLogado) {
    alert("Acesso restrito. Por favor, faça login.");
    window.location.replace("https://spi-tel.github.io/Login/");
  }

  // 2. Atualização dos dados do cabeçalho
  document.getElementById("nome-usuario").innerText = `Olá, ${usuarioLogado}`;
  document.getElementById("perfil-usuario").innerText = perfilUsuario || "Colaborador";
  
  // Exibição do Último Acesso
  const elUltimoAcesso = document.getElementById("info-ultimo-acesso");
  if (ultimoAcesso && ultimoAcesso !== "null" && ultimoAcesso !== "undefined") {
    elUltimoAcesso.innerText = `Último acesso: ${ultimoAcesso}`;
  } else {
    elUltimoAcesso.innerText = "Último acesso: Primeiro acesso";
  }

  // 3. Regras de permissão por Perfil
  const perfilNormalizado = perfilUsuario.toLowerCase();

  const cardDesempenhoRegionais = document.getElementById("card-desempenho-regionais");
  const cardHorasExtras = document.getElementById("card-horas-extras");
  const cardSobressalentes = document.getElementById("card-sobressalentes");
  const cardProducaoFatb = document.getElementById("card-producao-fatb");

  // Regras de bloqueio de visibilidade
  if (perfilNormalizado.includes("coordenador")) {
    // Coordenador: não vê Desempenho Regionais nem Sobressalentes
    if (cardDesempenhoRegionais) cardDesempenhoRegionais.remove();
    if (cardSobressalentes) cardSobressalentes.remove();
  } else if (perfilNormalizado.includes("supervisor")) {
    // Supervisor: não vê Desempenho Regionais, Horas Extras nem Produção FAT-B
    if (cardDesempenhoRegionais) cardDesempenhoRegionais.remove();
    if (cardHorasExtras) cardHorasExtras.remove();
    if (cardProducaoFatb) cardProducaoFatb.remove();
  } else if (perfilNormalizado.includes("gerente")) {
    // Gerente: vê tudo com exceção de Sobressalentes (específico de Supervisores)
    if (cardSobressalentes) cardSobressalentes.remove();
  }
  // Perfis Admin mantêm acesso total a todos os cards.

  // 4. Logout seguro
  function logout() {
    localStorage.removeItem("usuario_logado");
    localStorage.removeItem("perfil_usuario");
    localStorage.removeItem("ultimo_acesso");
    window.location.replace("https://spi-tel.github.io/Login/");
  }
</script>

</body>
</html>
