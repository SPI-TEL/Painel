<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAINEL DE CONTROLE - SPI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* FUNDO BRANCO FUTURÍSTICO / HIGH-TECH */
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: radial-gradient(circle at 50% 20%, #ffffff 0%, #edf3fa 50%, #dbe6f3 100%);
      background-attachment: fixed;
      min-height: 100vh;
      color: #0b1a2d;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 162, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 162, 255, 0.05) 1px, transparent 1px);
      background-size: 44px 44px;
      z-index: -1;
      pointer-events: none;
    }

    /* HEADER EM AZUL ESCURO FUTURISTA */
    .header {
      background: linear-gradient(135deg, rgba(7, 19, 36, 0.96) 0%, rgba(12, 35, 64, 0.94) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(0, 212, 255, 0.35);
      padding: 16px 40px;
      position: relative;
      box-shadow: 0 8px 30px rgba(7, 19, 36, 0.35), 0 2px 0 rgba(0, 212, 255, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 72px;
      z-index: 10;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
    }

    #nome-usuario {
      font-size: 15px;
      font-weight: 700;
      color: #f1f7fd;
      text-shadow: 0 0 10px rgba(0, 180, 255, 0.3);
    }

    .user-info span.role-badge {
      background: linear-gradient(135deg, #0052cc 0%, #0099ff 100%);
      color: #ffffff;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      font-weight: 700;
      border: 1px solid rgba(0, 212, 255, 0.5);
      box-shadow: 0 0 12px rgba(0, 153, 255, 0.45);
    }

    .last-access {
      font-size: 11px;
      color: #7fa4ca;
      letter-spacing: 0.3px;
      font-weight: 500;
    }

    .header-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #e2f1ff;
      text-transform: uppercase;
      text-align: center;
      flex-grow: 1;
      text-shadow: 0 0 16px rgba(0, 170, 255, 0.4);
    }

    .btn-logout {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #ff7676;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 0 10px rgba(220, 38, 38, 0.2);
    }

    .btn-logout:hover {
      background: #dc2626;
      color: #ffffff;
      border-color: #ef4444;
      transform: translateY(-1px);
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.6);
    }

    /* GRID DO PAINEL */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 30px;
      padding: 45px 40px;
      max-width: 1240px;
      margin: 0 auto;
    }

    /* CARDS ESCUROS FUTURISTAS COM NEON */
    .card {
      position: relative;
      background: linear-gradient(155deg, rgba(13, 31, 56, 0.94) 0%, rgba(7, 18, 34, 0.98) 100%);
      border-radius: 18px;
      padding: 30px 20px;
      text-align: center;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 
        0 12px 30px rgba(11, 26, 45, 0.25),
        inset 0 0 0 1px rgba(0, 195, 255, 0.2);
      border: 1px solid rgba(0, 195, 255, 0.35);
      transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 145px;
      overflow: hidden;
      cursor: pointer;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 20%, rgba(0, 212, 255, 0.08), transparent 75%);
      transition: all 0.4s ease;
      z-index: 0;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: #00e1ff;
      box-shadow: 
        0 18px 40px rgba(0, 140, 255, 0.25),
        0 0 20px rgba(0, 225, 255, 0.4),
        inset 0 0 14px rgba(0, 225, 255, 0.2);
    }

    /* BADGE EM CONSTRUÇÃO / EM BREVE */
    .badge-construcao {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 170, 0, 0.15);
      border: 1px solid rgba(255, 187, 0, 0.5);
      color: #ffcc00;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.6px;
      padding: 2px 8px;
      border-radius: 8px;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(255, 170, 0, 0.2);
      z-index: 2;
    }

    /* ÍCONES */
    .card svg {
      width: 52px;
      height: 52px;
      margin-bottom: 14px;
      z-index: 1;
      stroke: #00d9ff;
      transition: transform 0.35s ease, filter 0.35s ease, stroke 0.35s ease;
      filter: drop-shadow(0 0 8px rgba(0, 217, 255, 0.5));
    }

    .card:hover svg {
      transform: scale(1.12) translateY(-2px);
      stroke: #ffffff;
      filter: drop-shadow(0 0 14px #00ffff);
    }

    /* TEXTO DO CARD */
    .card span.card-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      z-index: 1;
      color: #e5f3ff;
      transition: color 0.3s ease, text-shadow 0.3s ease;
      line-height: 1.4;
    }

    .card:hover span.card-title {
      color: #00ffff;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
    }

    /* TOAST / ALERTA DE EM CONSTRUÇÃO */
    #toast-construcao {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(7, 19, 36, 0.95);
      border: 1px solid rgba(255, 187, 0, 0.5);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35), 0 0 15px rgba(255, 187, 0, 0.25);
      backdrop-filter: blur(12px);
      color: #ffffff;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;
      transform: translateY(120px);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #toast-construcao.show {
      transform: translateY(0);
      opacity: 1;
    }

    #toast-construcao i {
      color: #ffcc00;
      font-size: 16px;
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        text-align: center;
      }
      .user-info {
        align-items: center;
      }
      .btn-logout {
        position: static;
        margin-top: 5px;
      }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="user-info">
    <span id="nome-usuario">Olá, Usuário</span>
    <span id="perfil-usuario" class="role-badge">Perfil</span>
    <span id="info-ultimo-acesso" class="last-access">Último acesso: --</span>
  </div>

  <div class="header-title">PAINEL DE CONTROLE - SPI</div>

  <button class="btn-logout" onclick="logout()">
    <i class="fa-solid fa-right-from-bracket"></i>
    <span>Sair</span>
  </button>
</div>

<div class="grid-container">

  <!-- 1. Desempenho Regionais (Oculto para Coordenador e Supervisor) -->
  <a id="card-desempenho-regionais" href="https://spi-tel.github.io/Desempenho-SPI---Regionais/" class="card" target="_blank">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="2" y1="12" x2="22" y2="12"></line>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
    </svg>
    <span class="card-title">Desempenho Regionais</span>
  </a>

  <!-- 2. Horas Extras (Oculto para Supervisor) -->
  <a id="card-horas-extras" href="https://spi-tel.github.io/Fechamento-Horas-Extras/" class="card" target="_blank">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <polyline points="12 6 12 12 16 14"></polyline>
    </svg>
    <span class="card-title">Horas Extras</span>
  </a>

  <!-- 3. Controle GMG -->
  <a id="card-controle-gmg" href="https://spi-tel.github.io/Controle-GMGM/" class="card" target="_blank">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="2" width="10" height="8" rx="2" ry="2"></rect>
      <path d="M12 10v6"></path>
      <line x1="9" y1="2" x2="9" y2="0"></line>
      <line x1="15" y1="2" x2="15" y2="0"></line>
      <path d="M8 22h8"></path>
      <path d="M12 16a4 4 0 0 1 4 4v2"></path>
      <path d="M12 16a4 4 0 0 0-4 4v2"></path>
    </svg>
    <span class="card-title">Controle GMG</span>
  </a>

  <!-- 4. NC/COR -->
  <a id="card-nc-cor" href="https://spi-tel.github.io/NC-COR/" class="card" target="_blank">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
      <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
      <path d="m9 14 2 2 4-4"></path>
    </svg>
    <span class="card-title">NC/COR</span>
  </a>

  <!-- 5. Furto e Vandalismo -->
  <a id="card-furto-vandalismo" href="https://spi-tel.github.io/Furto-e-Vandalismo/" class="card" target="_blank">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke: #ff9900; filter: drop-shadow(0 0 8px rgba(255, 153, 0, 0.6));">
      <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
      <line x1="12" y1="9" x2="12" y2="13"></line>
      <line x1="12" y1="17" x2="12.01" y2="17"></line>
    </svg>
    <span class="card-title">Furto e Vandalismo</span>
  </a>

  <!-- 6. TA - Causa Perda -->
  <a id="card-causas-perda-tas" href="https://spi-tel.github.io/Causas-Perca-TAs/" class="card" target="_blank">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
      <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
      <line x1="9" y1="12" x2="15" y2="12"></line>
      <line x1="9" y1="16" x2="13" y2="16"></line>
    </svg>
    <span class="card-title">TA - Causa Perda</span>
  </a>

  <!-- 7. HL5 -->
  <a id="card-hl5" href="https://spi-tel.github.io/HL5/" class="card" target="_blank">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L5 22h14L12 2z"></path>
      <path d="M7 17h10"></path>
      <path d="M8.5 12h7"></path>
      <path d="M10 7h4"></path>
      <path d="M17 4a4 4 0 0 1 0 5"></path>
      <path d="M7 4a4 4 0 0 0 0 5"></path>
      <path d="M19 2a8 8 0 0 1 0 9"></path>
      <path d="M5 2a8 8 0 0 0 0 9"></path>
    </svg>
    <span class="card-title">HL5</span>
  </a>

  <!-- 8. USCA - Modernização -->
  <a id="card-usca" href="https://spi-tel.github.io/Moderniza-o-USCA/" class="card" target="_blank">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <circle cx="8.5" cy="8.5" r="1.5"></circle>
      <polyline points="21 15 16 10 5 21"></polyline>
    </svg>
    <span class="card-title">USCA - Modernização</span>
  </a>

  <!-- 9. Preventivas (Visível para todos) -->
  <a id="card-preventivas" href="https://spi-tel.github.io/Preventivas/" class="card" target="_blank">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
    </svg>
    <span class="card-title">Preventivas</span>
  </a>

  <!-- 10. Sobressalentes (Visível para todos - Em Construção) -->
  <a id="card-sobressalentes" class="card" onclick="moduloEmConstrucao('Sobressalentes')">
    <div class="badge-construcao">Em Breve</div>
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
      <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
      <line x1="12" y1="22.08" x2="12" y2="12"></line>
    </svg>
    <span class="card-title">Sobressalentes</span>
  </a>

  <!-- 11. Produção FAT-B (Oculto para Supervisor - Em Construção) -->
  <a id="card-producao-fatb" class="card" onclick="moduloEmConstrucao('Produção FAT-B')">
    <div class="badge-construcao">Em Breve</div>
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="20" x2="18" y2="10"></line>
      <line x1="12" y1="20" x2="12" y2="4"></line>
      <line x1="6" y1="20" x2="6" y2="14"></line>
    </svg>
    <span class="card-title">Produção FAT-B</span>
  </a>

  <!-- 12. Bairros Críticos (Visível para todos - Em Construção) -->
  <a id="card-bairros-criticos" class="card" onclick="moduloEmConstrucao('Bairros Críticos')">
    <div class="badge-construcao">Em Breve</div>
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
      <circle cx="12" cy="10" r="3"></circle>
    </svg>
    <span class="card-title">Bairros Críticos</span>
  </a>

</div>

<!-- Notificação Toast futurista -->
<div id="toast-construcao">
  <i class="fa-solid fa-triangle-exclamation"></i>
  <span id="toast-mensagem">Módulo em fase de construção!</span>
</div>

<script>
  // 1. Verificação de sessão
  const usuarioLogado = localStorage.getItem("usuario_logado");
  const perfilUsuario = (localStorage.getItem("perfil_usuario") || "").trim();
  const ultimoAcesso = localStorage.getItem("ultimo_acesso");

  if (!usuarioLogado) {
    alert("Acesso restrito. Por favor, faça login.");
    window.location.replace("https://spi-tel.github.io/Login/");
  }

  // 2. Atualização dos dados do cabeçalho
  document.getElementById("nome-usuario").innerText = `Olá, ${usuarioLogado}`;
  document.getElementById("perfil-usuario").innerText = perfilUsuario || "Colaborador";
  
  // Exibição do Último Acesso
  const elUltimoAcesso = document.getElementById("info-ultimo-acesso");
  if (ultimoAcesso && ultimoAcesso !== "null" && ultimoAcesso !== "undefined") {
    elUltimoAcesso.innerText = `Último acesso: ${ultimoAcesso}`;
  } else {
    elUltimoAcesso.innerText = "Último acesso: Primeiro acesso";
  }

  // 3. Regras de permissão por Perfil
  const perfilNormalizado = perfilUsuario.toLowerCase();

  const cardDesempenhoRegionais = document.getElementById("card-desempenho-regionais");
  const cardHorasExtras = document.getElementById("card-horas-extras");
  const cardProducaoFatb = document.getElementById("card-producao-fatb");
  // Sobressalentes, Preventivas e Bairros Críticos permanecem visíveis para todos os perfis

  if (perfilNormalizado.includes("coordenador")) {
    // Coordenador vê todos menos Desempenho Regionais
    if (cardDesempenhoRegionais) cardDesempenhoRegionais.remove();
  } else if (perfilNormalizado.includes("supervisor")) {
    // Supervisor vê todos menos Desempenho Regionais, Horas Extras e Produção FAT-B
    if (cardDesempenhoRegionais) cardDesempenhoRegionais.remove();
    if (cardHorasExtras) cardHorasExtras.remove();
    if (cardProducaoFatb) cardProducaoFatb.remove();
  }
  // Admin e Gerente mantêm todos os cards visíveis

  // 4. Feedback visual para cards em construção
  let toastTimer;
  function moduloEmConstrucao(nomeModulo) {
    const toast = document.getElementById("toast-construcao");
    const msg = document.getElementById("toast-mensagem");
    
    msg.innerText = `Módulo "${nomeModulo}" em fase de implantação. Disponível em breve!`;
    toast.classList.add("show");

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 3500);
  }

  // 5. Logout seguro
  function logout() {
    localStorage.removeItem("usuario_logado");
    localStorage.removeItem("perfil_usuario");
    localStorage.removeItem("ultimo_acesso");
    window.location.replace("https://spi-tel.github.io/Login/");
  }
</script>

</body>
</html>
